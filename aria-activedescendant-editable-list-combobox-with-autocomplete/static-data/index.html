<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS</title>
    <link rel="stylesheet" href="autocomplete.css">
</head>

<body>
    <div class="autocomplete">
        <label for="city">City</label>
        <div class="input-wrapper">
            <input id="city" name="city" type="text" autocomplete="off" spellcheck="false" role="combobox"
                aria-autocomplete="list" aria-controls="city-listbox" aria-expanded="false" />
            <button id="combobox-button" type="button" tabindex="-1" aria-label="City"
                aria-controls="city-listbox" aria-expanded="false">
                <svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16" focusable="false">
                    <polygon points="3,4 15,4 9,12"></polygon>
                </svg>
            </button>
        </div>
        <ul id="city-listbox" role="listbox" hidden aria-label="Cities"></ul>
    </div>
    <script src="autocomplete.js"></script>
</body>

</html>
