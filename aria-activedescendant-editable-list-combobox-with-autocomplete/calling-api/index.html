<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aria-activedescendant and aria-selected autocomplete with DummyJSON products</title>
    <link rel="stylesheet" href="autocomplete.css">
</head>

<body>
    <div class="autocomplete">
        <label for="autocomplete-input">Search products</label>
        <div class="input-wrapper">
            <input id="autocomplete-input" name="search" type="text" autocomplete="off" spellcheck="false"
                role="combobox" aria-autocomplete="list" aria-controls="autocomplete-listbox" aria-expanded="false">
            <button id="autocomplete-button" type="button" tabindex="-1" aria-label="Show suggestions"
                aria-controls="autocomplete-listbox" aria-expanded="false">
                <svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16" focusable="false">
                    <polygon points="3,4 15,4 9,12"></polygon>
                </svg>
            </button>
        </div>
        <ul id="autocomplete-listbox" role="listbox" hidden></ul>
        <div id="autocomplete-status" role="status" aria-atomic="true"></div>
    </div>
    <script src="api.js"></script>
    <script src="autocomplete.js"></script>
</body>

</html>
